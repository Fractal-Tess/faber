services:
  faber:
    container_name: faber-prod
    # Pin a released version in production, e.g. FABER_IMAGE=vgfractal/faber:0.2.0
    image: ${FABER_IMAGE:-vgfractal/faber:latest}
    build:
      context: ../../
      dockerfile: docker/prod/Dockerfile
    ports:
      - '${FABER_BIND_ADDRESS:-127.0.0.1}:${FABER_PORT:-3000}:3000'
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - API_KEY=${API_KEY:?Set API_KEY before starting Faber}
      - CACHE_ENABLED=${CACHE_ENABLED:-false}
      # Task slots; the faber cgroup is sized (MEMORY_MAX + supervisor
      # allowance) x slots, see "How the limits relate" in the README.
      - MAX_CONCURRENCY=${MAX_CONCURRENCY:-10}
      - MAX_PARALLEL_TASKS=${MAX_PARALLEL_TASKS:-8}
      - MEMORY_MAX=${MEMORY_MAX:-256M}
      - PIDS_MAX=${PIDS_MAX:-64}
      - CPU_MAX=${CPU_MAX:-50000 100000}
      - WALL_TIMEOUT_MS=${WALL_TIMEOUT_MS:-5000}
      - OVERALL_TIMEOUT_MS=${OVERALL_TIMEOUT_MS:-30000}
      - OUTPUT_LIMIT_BYTES=${OUTPUT_LIMIT_BYTES:-1048576}
      - REQUEST_OUTPUT_LIMIT_BYTES=${REQUEST_OUTPUT_LIMIT_BYTES:-16777216}
      - FABER_STORE_MAX_TOTAL_BYTES=${FABER_STORE_MAX_TOTAL_BYTES:-536870912}
      - FABER_STORE_TTL_SECS=${FABER_STORE_TTL_SECS:-3600}
      # Must stay below stop_grace_period.
      - SHUTDOWN_TIMEOUT_MS=${SHUTDOWN_TIMEOUT_MS:-5000}
    privileged: true
    cgroup: host
    # Reaps supervisors orphaned by an abnormal exit; Faber itself is not an
    # init process.
    init: true
    # Faber writes only sandbox root skeletons, under /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    # Backstop above Faber's own aggregate cgroup limits: with the defaults
    # ((MEMORY_MAX + supervisor allowance) x MAX_CONCURRENCY) that is about
    # 6.3 GiB and 670 processes. Raise these together with MAX_CONCURRENCY.
    mem_limit: ${FABER_MEMORY_LIMIT:-8g}
    memswap_limit: ${FABER_MEMORY_LIMIT:-8g}
    pids_limit: ${FABER_PIDS_LIMIT:-4096}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    stop_grace_period: 10s
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '--fail',
          '--silent',
          'http://localhost:3000/api/v1/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true

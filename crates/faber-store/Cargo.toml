[package]
name = "faber-store"
version = "0.1.0"
edition = "2024"
description = "Distributed file storage for Faber artifact caching"

[features]
default = ["memory"]
memory = ["dashmap"]
filesystem = ["tokio/fs", "tokio/io-util", "tempfile"]
full = ["memory", "filesystem"]

[dependencies]
async-trait = "0.1"
bytes = "1.5"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = { version = "3", optional = true }
thiserror = "2.0"
tokio = { version = "1.47", features = ["rt", "sync", "time"] }
dashmap = { version = "6.0", optional = true }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.47", features = ["rt", "sync", "time", "macros", "rt-multi-thread"] }
tempfile = "3"
